# Example configuration file
[env]
PYTHON_VERSION = 3.12
dir_conda_env = "null"  # "null" if environment is not available

[paths]
data_dir = "/path/to/data"
output_dir = "/path/to/output"
cache_dir = "/path/to/cache"

[environment_variables]
# These will be loaded into os.environ when load_environment() is called
CUSTOM_VAR = "value"
DEBUG_MODE = "false"
MAX_WORKERS = "4"
LOG_LEVEL = "INFO"